apiVersion: v1
kind: ServiceAccount
metadata:
 name: pod-status-logger
 namespace: myapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-status-logger-reader
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-status-logger-binding
subjects:
- kind: ServiceAccount
  name: pod-status-logger
  namespace: myapp
roleRef:
  kind: ClusterRole
  name: pod-status-logger-reader
  apiGroup: rbac.authorization.k8s.io
