apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: workshop
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop
      component: database
  template:
    metadata:
      labels:
        app: workshop
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: task_db
            - name: POSTGRES_USER
              value: root
            - name: POSTGRES_PASSWORD
              value: root
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
