apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: workshop
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop
      component: frontend
  template:
    metadata:
      labels:
        app: workshop
        component: frontend
    spec:
      containers:
        - name: frontend
          image: prashidha333/workshop-frontend:latest
          #imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BACKEND_URL
              value: http://backend-service.default.svc.cluster.local:3000
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
